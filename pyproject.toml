[project]
name = "chunking_metrics"
version = "0.1.0"
description = "Document Chunking Metrics Framework"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "huggingface-hub>=1.27.0",
    "numpy>=2.2.6",
    "openai>=2.53.0",
    "pydantic>=2.13,<3",
    "sentence-transformers>=5.6,<6",
    "torch>=2.4",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "icecream>=2.2.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--log-cli-level=INFO"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
