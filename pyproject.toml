[project]
name = "chunking_metrics"
version = "0.1.0"
description = "Document Chunking Metrics Framework"
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["numpy>=2.2.6"]

[dependency-groups]
dev = ["icecream>=2.2.0", "pytest>=9.1.1", "ruff>=0.16.2"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--log-cli-level=INFO"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
